<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabellone d'asta — Fantacalcio 2026/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#04060D; --navy:#08152C; --steel:#0E2247; --line:rgba(198,164,88,.18);
  --ink:#E9EEF8; --mute:#8093B2; --faint:#4C5B75;
  --brass:#C6A458;
  --por:#D9A441; --dc:#4FA3C7; --cc:#6FB58A; --att:#D8664F;
  --accent:var(--por);
  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  font-family:var(--sans);
  color:var(--ink);
  background:
    radial-gradient(1200px 700px at 12% -8%, rgba(30,72,140,.42), transparent 60%),
    radial-gradient(900px 600px at 92% 8%, rgba(14,34,71,.55), transparent 62%),
    linear-gradient(168deg, #0B1C3C 0%, #071129 42%, #04060D 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 64px}

/* ---------- header ---------- */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.brand p{margin:5px 0 0;color:var(--mute);font-size:13px;letter-spacing:.02em}
.budget{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.budget input{width:82px;background:rgba(255,255,255,.05);border:1px solid var(--line);
  color:var(--ink);font-family:var(--mono);font-size:14px;padding:7px 9px;border-radius:7px;text-align:right}

/* ---------- role band (signature) ---------- */
.band{margin:22px 0 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:linear-gradient(90deg, color-mix(in srgb,var(--accent) 14%, transparent), rgba(255,255,255,.02));
  transition:background .45s ease}
@media (prefers-reduced-motion:reduce){.band{transition:none}}
.band-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px 0;flex-wrap:wrap}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.band-count{font-family:var(--mono);font-size:12px;color:var(--mute)}
.band-count b{color:var(--accent);font-weight:600}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 18px 18px}
.role{position:relative;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);
  color:var(--mute);font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:.06em;
  padding:16px 8px 14px;border-radius:11px;cursor:pointer;transition:.2s;text-align:center}
.role span{display:block;font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.04em;
  margin-top:5px;opacity:.75}
.role:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.role:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.role.on{color:#08152C;border-color:transparent;background:var(--rc);box-shadow:0 6px 22px -8px var(--rc)}
.role.on span{opacity:.7}
.role[data-r=POR]{--rc:var(--por)} .role[data-r=DC]{--rc:var(--dc)}
.role[data-r=CC]{--rc:var(--cc)} .role[data-r=ATT]{--rc:var(--att)}

/* ---------- entry form ---------- */
.entry{display:grid;grid-template-columns:1fr 110px 1fr auto;gap:10px;margin-top:16px;align-items:start}
.field{position:relative}
label.lbl{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mute);margin-bottom:6px}
input[type=text],input[type=number]{width:100%;background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:13px 14px;
  font-family:var(--sans);font-size:15px}
#price{font-family:var(--mono);text-align:right}
input:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,.08)}
input::placeholder{color:#4C5B75}
.assign{align-self:end;background:var(--accent);color:#08152C;border:none;border-radius:10px;
  padding:13px 26px;font-family:var(--sans);font-size:15px;font-weight:700;cursor:pointer;
  letter-spacing:.01em;transition:.2s}
.assign:hover{filter:brightness(1.1)}
.assign:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* autocomplete */
.ac{position:absolute;z-index:40;top:calc(100% + 5px);left:0;right:0;max-height:250px;overflow-y:auto;
  background:#0A1730;border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 44px -14px #000;display:none}
.ac.open{display:block}
.ac div{padding:10px 13px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.ac div small{color:var(--mute);font-size:11px;font-family:var(--mono)}
.ac div:hover,.ac div.sel{background:rgba(198,164,88,.16)}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--mute);
  font-size:12px;padding:6px 12px;border-radius:20px;cursor:pointer;font-family:var(--sans)}
.chip:hover{color:var(--ink);border-color:var(--accent)}
.chip.on{background:var(--accent);color:#08152C;border-color:transparent;font-weight:600}

/* ---------- panels ---------- */
.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;margin-top:30px}
.panel{background:rgba(255,255,255,.028);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);
  margin:0 0 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.panel h2 em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.02em}

table{width:100%;border-collapse:collapse}
th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
  text-align:left;padding:0 8px 9px;font-weight:500}
td{padding:9px 8px;border-top:1px solid rgba(255,255,255,.055);font-size:14px;vertical-align:middle}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.tag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:3px 7px;
  border-radius:4px;color:#08152C;font-weight:600}
.t-POR{background:var(--por)} .t-DC{background:var(--dc)} .t-CC{background:var(--cc)} .t-ATT{background:var(--att)}
.del{background:none;border:none;color:#4C5B75;cursor:pointer;font-size:17px;line-height:1;padding:2px 5px;border-radius:5px}
.del:hover{color:var(--att);background:rgba(216,102,79,.12)}
tbody tr.new td{animation:flash .8s ease-out}
@keyframes flash{from{background:rgba(198,164,88,.2)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){tbody tr.new td{animation:none}}

.bar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--brass);border-radius:2px}
.slots{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.05em;margin-top:4px}
.slots b{color:var(--ink);font-weight:500}

.empty{color:var(--mute);font-size:13px;padding:22px 4px;line-height:1.65}
.empty b{color:var(--ink);font-weight:600;display:block;margin-bottom:5px}

.tools{display:flex;gap:9px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.tool{background:none;border:1px solid var(--line);color:var(--mute);font-family:var(--sans);
  font-size:12px;padding:9px 15px;border-radius:8px;cursor:pointer}
.tool:hover{color:var(--ink);border-color:var(--brass)}
#search{max-width:180px;padding:8px 11px;font-size:13px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#0A1730;border:1px solid var(--brass);color:var(--ink);padding:12px 22px;border-radius:10px;
  font-size:14px;box-shadow:0 18px 40px -12px #000;transition:transform .3s;z-index:80}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:860px){
  .cols{grid-template-columns:1fr}
  .entry{grid-template-columns:1fr 100px;grid-template-areas:"n n" "p t" "b b"}
  .entry .f-name{grid-area:n}.entry .f-price{grid-area:p}.entry .f-team{grid-area:t}.entry .assign{grid-area:b;width:100%}
  .roles{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">
    <h1>Tabellone d'asta</h1>
    <p>Fantacalcio 2026/27 · asta a chiamata · 10 squadre</p>
  </div>
  <div class="budget">
    <label for="budget">Crediti per squadra</label>
    <input type="number" id="budget" value="1000" min="1" step="50">
  </div>
</header>

<section class="band" aria-label="Ruolo in chiamata">
  <div class="band-top">
    <div class="eyebrow">Ruolo in chiamata</div>
    <div class="band-count" id="bandCount"></div>
  </div>
  <div class="roles" role="group">
    <button class="role on" data-r="POR" type="button">POR <span id="c-POR">0</span></button>
    <button class="role" data-r="DC" type="button">DC <span id="c-DC">0</span></button>
    <button class="role" data-r="CC" type="button">CC <span id="c-CC">0</span></button>
    <button class="role" data-r="ATT" type="button">ATT <span id="c-ATT">0</span></button>
  </div>
</section>

<div class="entry">
  <div class="field f-name">
    <label class="lbl" for="name">Giocatore</label>
    <input type="text" id="name" autocomplete="off" placeholder="Inizia a scrivere il cognome">
    <div class="ac" id="ac"></div>
  </div>
  <div class="field f-price">
    <label class="lbl" for="price">Prezzo</label>
    <input type="number" id="price" min="1" placeholder="0">
  </div>
  <div class="field f-team">
    <label class="lbl" for="team">Se l'è preso</label>
    <input type="text" id="team" autocomplete="off" placeholder="Nome fantasquadra">
  </div>
  <button class="assign" id="assign" type="button">Assegna</button>
</div>
<div class="chips" id="teamChips"></div>

<div class="cols">
  <div class="panel">
    <h2>Registro assegnazioni <em id="regCount"></em></h2>
    <input type="text" id="search" placeholder="Cerca…" style="margin-bottom:12px">
    <div id="log"></div>
  </div>
  <div class="panel">
    <h2>Squadre <em id="teamCount"></em></h2>
    <div id="teams"></div>
  </div>
</div>

<div class="tools">
  <button class="tool" id="exp" type="button">Esporta CSV</button>
  <button class="tool" id="reset" type="button">Azzera tutto</button>
</div>
</div>

<div class="toast" id="toast"></div>

const ROLES = ['POR','DC','CC','ATT'];
const SLOTS = {POR:3, DC:8, CC:8, ATT:6};
const TOTAL_SLOTS = 25;
const KEY = 'fanta-asta-2027';

let state = { role:'POR', budget:1000, picks:[] };
let memory = null;

/* ---------- storage: window.storage, poi localStorage, poi memoria ---------- */
async function save(){
  const payload = JSON.stringify({role:state.role, budget:state.budget, picks:state.picks});
  memory = payload;
  try{ if(window.storage){ await window.storage.set(KEY, payload, false); return; } }catch(e){}
  try{ localStorage.setItem(KEY, payload); }catch(e){}
}
async function load(){
  let raw = null;
  try{ if(window.storage){ const r = await window.storage.get(KEY, false); raw = r && r.value; } }catch(e){}
  if(!raw){ try{ raw = localStorage.getItem(KEY); }catch(e){} }
  if(!raw) raw = memory;
  if(raw){ try{ const d = JSON.parse(raw);
    if(d.picks) state.picks = d.picks;
    if(d.budget) state.budget = d.budget;
    if(d.role && ROLES.includes(d.role)) state.role = d.role;
  }catch(e){} }
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- ruolo persistente ---------- */
function setRole(r){
  state.role = r;
  document.querySelectorAll('.role').forEach(b=>b.classList.toggle('on', b.dataset.r===r));
  document.documentElement.style.setProperty('--accent', `var(--${r.toLowerCase()})`);
  render(); save();
}
document.querySelectorAll('.role').forEach(b=>{
  b.addEventListener('click', ()=>{ setRole(b.dataset.r); $('name').focus(); });
});

/* ---------- autocomplete ---------- */
let acIdx = -1, acList = [];
$('name').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  const box = $('ac');
  if(q.length < 2){ box.classList.remove('open'); return; }
  const taken = new Set(state.picks.map(p=>p.name.toLowerCase()));
  acList = PLAYERS.filter(p=>p[0].toLowerCase().includes(q) && !taken.has(p[0].toLowerCase())).slice(0,8);
  if(!acList.length){ box.classList.remove('open'); return; }
  acIdx = -1;
  box.innerHTML = acList.map((p,i)=>`<div data-i="${i}"><span>${esc(p[0])}</span><small>${esc(p[1])}</small></div>`).join('');
  box.classList.add('open');
});
$('ac').addEventListener('mousedown', e=>{
  const d = e.target.closest('div[data-i]'); if(!d) return;
  e.preventDefault(); pick(+d.dataset.i);
});
function pick(i){ $('name').value = acList[i][0]; $('ac').classList.remove('open'); $('price').focus(); }
$('name').addEventListener('keydown', e=>{
  const box = $('ac');
  if(!box.classList.contains('open')){ if(e.key==='Enter') $('price').focus(); return; }
  const items = box.querySelectorAll('div');
  if(e.key==='ArrowDown'){ e.preventDefault(); acIdx=Math.min(acIdx+1,items.length-1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); acIdx=Math.max(acIdx-1,0); }
  else if(e.key==='Enter'){ e.preventDefault(); acIdx>=0 ? pick(acIdx) : (box.classList.remove('open'), $('price').focus()); return; }
  else if(e.key==='Escape'){ box.classList.remove('open'); return; }
  else return;
  items.forEach((el,i)=>el.classList.toggle('sel', i===acIdx));
});
$('name').addEventListener('blur', ()=> setTimeout(()=>$('ac').classList.remove('open'), 120));

/* ---------- assegnazione ---------- */
$('price').addEventListener('keydown', e=>{ if(e.key==='Enter') $('team').focus(); });
$('team').addEventListener('keydown', e=>{ if(e.key==='Enter') assign(); });
$('assign').addEventListener('click', assign);

function assign(){
  const name = $('name').value.trim();
  const price = parseInt($('price').value, 10);
  const team = $('team').value.trim();
  if(!name)  return toast('Manca il nome del giocatore');
  if(!(price > 0)) return toast('Manca il prezzo');
  if(!team)  return toast('Manca la fantasquadra');
  if(state.picks.some(p => p.name.toLowerCase() === name.toLowerCase()))
    return toast(name + ' è già stato assegnato');

  state.picks.unshift({id:Date.now(), name, price, team, role:state.role});
  $('name').value = ''; $('price').value = ''; $('team').value = '';
  render(); save(); $('name').focus();
  toast(`${name} → ${team} per ${price}`);
}
function remove(id){ state.picks = state.picks.filter(p=>p.id!==id); render(); save(); }

/* ---------- rendering ---------- */
function teamStats(){
  const map = {};
  state.picks.forEach(p=>{
    const k = p.team;
    if(!map[k]) map[k] = {team:k, spent:0, n:0, POR:0, DC:0, CC:0, ATT:0};
    map[k].spent += p.price; map[k].n++; map[k][p.role]++;
  });
  return Object.values(map).sort((a,b)=>b.spent-a.spent);
}

function render(){
  const B = state.budget;
  ROLES.forEach(r=>{
    const n = state.picks.filter(p=>p.role===r).length;
    $('c-'+r).textContent = n;
  });
  const cur = state.picks.filter(p=>p.role===state.role).length;
  const capacity = SLOTS[state.role] * Math.max(teamStats().length, 10);
  $('bandCount').innerHTML = `<b>${cur}</b> assegnati su ${capacity} slot di ruolo`;

  /* chips squadre già usate */
  const stats = teamStats();
  $('teamChips').innerHTML = stats.map(t=>
    `<button class="chip" type="button" data-t="${esc(t.team)}">${esc(t.team)}</button>`).join('');
  $('teamChips').querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{ $('team').value = c.dataset.t; $('name').focus(); });
  });

  /* registro */
  const q = $('search').value.trim().toLowerCase();
  const rows = state.picks.filter(p => !q || p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q));
  $('regCount').textContent = state.picks.length ? state.picks.length + ' giocatori · ' +
    state.picks.reduce((s,p)=>s+p.price,0) + ' crediti mossi' : '';

      <th>Ruolo</th><th>Giocatore</th><th>Fantasquadra</th><th class="num">Prezzo</th><th></th>

      <td><span class="tag t-${p.role}">${p.role}</span></td>
      <td>${esc(p.name)}</td>
      <td style="color:var(--mute)">${esc(p.team)}</td>
      <td class="num">${p.price}</td>
      <td style="width:26px"><button class="del" type="button" data-id="${p.id}" title="Elimina">×</button></td>
    </tr>`).join('')}</tbody></table>`
    : `<div class="empty"><b>Nessuna assegnazione</b>${state.picks.length
        ? 'Nessun risultato per questa ricerca.'
        : 'Scegli il ruolo in chiamata, scrivi il giocatore, il prezzo e chi se l\'è aggiudicato.'}</div>`;
  $('log').querySelectorAll('.del').forEach(b=>b.addEventListener('click',()=>remove(+b.dataset.id)));

  /* squadre */
  $('teamCount').textContent = stats.length ? stats.length + ' in gioco' : '';
  $('teams').innerHTML = stats.length ? `<table><thead><tr>
      <th>Fantasquadra</th><th class="num">Residuo</th><th class="num">Max&nbsp;offerta</th>
    </tr></thead><tbody>${stats.map(t=>{
      const left = B - t.spent;
      const free = TOTAL_SLOTS - t.n;
      const max = free > 0 ? Math.max(left - (free - 1), 0) : 0;
      return `<tr>
        <td>${esc(t.team)}
          <div class="bar"><i style="width:${Math.min(100, t.spent/B*100)}%"></i></div>
          <div class="slots">P <b>${t.POR}</b>/3 · D <b>${t.DC}</b>/8 · C <b>${t.CC}</b>/8 · A <b>${t.ATT}</b>/6</div>
        </td>
        <td class="num">${left}</td>
        <td class="num" style="color:var(--brass)">${max}</td>
      </tr>`;}).join('')}</tbody></table>`
    : `<div class="empty"><b>Ancora nessuna squadra</b>Compaiono qui appena assegni il primo giocatore, con crediti residui e offerta massima possibile.</div>`;
}

$('search').addEventListener('input', render);
$('budget').addEventListener('input', e=>{
  const v = parseInt(e.target.value,10); if(v>0){ state.budget = v; render(); save(); }
});

/* ---------- strumenti ---------- */
$('exp').addEventListener('click', ()=>{
  if(!state.picks.length) return toast('Non c\'è ancora niente da esportare');
  const rows = [['Ruolo','Giocatore','Fantasquadra','Prezzo']]
    .concat(state.picks.slice().reverse().map(p=>[p.role,p.name,p.team,p.price]));
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'asta-2027.csv'; a.click();
});
$('reset').addEventListener('click', ()=>{
  if(!state.picks.length) return;
  if(confirm('Cancello tutte le ' + state.picks.length + ' assegnazioni? Non si torna indietro.')){
    state.picks = []; render(); save(); toast('Tabellone azzerato');
  }
});

let tid;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(tid); tid = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- avvio ---------- */
(async function(){
  await load();
  $('budget').value = state.budget;
  setRole(state.role);
  $('name').focus();
})();
</script>
</body>
</html>
